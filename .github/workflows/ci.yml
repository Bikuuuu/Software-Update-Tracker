name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore SoftwareUpdateTracker.slnx
      - run: dotnet build SoftwareUpdateTracker.slnx -c Release --no-restore
      - run: dotnet test SoftwareUpdateTracker.slnx -c Release --no-build
  winget:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      SUT_WINGET_REQUIRED: '1'
      SUT_WINGET_UPGRADE_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Update winget
        shell: pwsh
        run: |
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Force -Scope CurrentUser -Repository PSGallery
          Repair-WinGetPackageManager -Version 1.29.380 -Force
          winget --version
      - name: Install old test packages
        shell: pwsh
        run: |
          winget install --id Notepad++.Notepad++ --version 8.9.7 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          winget install --id VideoLAN.VLC --version 3.0.20 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: winget tests
        run: dotnet test --project tests/SoftwareUpdateTracker.WinGet.Tests -c Release --fail-skips on
